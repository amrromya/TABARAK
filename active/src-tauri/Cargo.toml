[package]
name = "tabarak-license-manager"
version = "1.0.0"
description = "Tabarak License Manager"
edition = "2021"

[lib]
name = "license_manager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"
